<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보안규정 안내 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 820px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* 헤더 */
    .chat-header {
      background: #1a3a6b;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header .icon    { font-size: 1.5rem; }
    .chat-header .title   { font-size: 1.05rem; font-weight: 700; }
    .chat-header .subtitle{ font-size: 0.76rem; opacity: 0.75; margin-top: 2px; }

    /* 메시지 영역 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    /* 사용자 말풍선 */
    .msg-user {
      align-self: flex-end;
      max-width: 65%;
      background: #1a3a6b;
      color: #fff;
      padding: 10px 15px;
      border-radius: 16px;
      border-bottom-right-radius: 3px;
      font-size: 0.92rem;
      line-height: 1.6;
      word-break: break-word;
    }

    /* 결과 영역 */
    .result-block { align-self: flex-start; width: 100%; }

    .result-header {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }

    /* 조항 아코디언 */
    .accordion {
      border: 1px solid #dde3ec;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .accordion-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: #f4f6fb;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      gap: 10px;
    }
    .accordion-title:hover { background: #e8edf6; }

    .title-group { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    .chapter-text {
      font-size: 0.72rem;
      color: #888;
      font-weight: 400;
    }

    .accordion-title .title-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1a3a6b;
    }

    .accordion-title .source-badge {
      font-size: 0.7rem;
      background: #dce4f0;
      color: #1a3a6b;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .accordion-title .arrow {
      font-size: 0.75rem;
      color: #888;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .accordion.open .arrow { transform: rotate(180deg); }

    .accordion-body {
      display: none;
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.8;
      color: #333;
      background: #fff;
      border-top: 1px solid #dde3ec;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .accordion.open .accordion-body { display: block; }

    /* 결과 없음 */
    .no-result {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.88rem;
      color: #666;
      line-height: 1.7;
    }

    /* 로딩 */
    .loading-dots {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      background: #f1f3f6;
      border-radius: 14px;
      align-self: flex-start;
    }
    .loading-dots span {
      width: 7px; height: 7px;
      background: #aaa; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100%{ transform:translateY(0); }
      40%        { transform:translateY(-6px); }
    }

    .welcome {
      text-align: center;
      color: #999;
      font-size: 0.86rem;
      padding: 28px 0 8px;
      line-height: 2;
    }

    /* 입력 */
    .hint { font-size: 0.7rem; color: #bbb; text-align: center; padding: 4px 0; }

    .chat-input-area {
      padding: 14px 18px;
      border-top: 1px solid #eaecef;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1.5px solid #d0d5dd;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.5;
      outline: none;
      max-height: 110px;
    }
    textarea:focus { border-color: #1a3a6b; }

    button {
      background: #1a3a6b;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.92rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      height: 42px;
      white-space: nowrap;
    }
    button:hover    { background: #16325e; }
    button:disabled { background: #9ab0d0; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="chat-wrapper">

  <div class="chat-header">
    <div class="icon">🔒</div>
    <div>
      <div class="title">보안규정 안내 챗봇</div>
      <div class="subtitle">관련 조항을 찾아 타이틀을 클릭하면 내용을 확인할 수 있습니다</div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="welcome">
      안녕하세요! 보안규정 안내 챗봇입니다.<br>
      궁금한 내용을 입력하면 관련 조항을 찾아드립니다.<br>
      <span style="color:#bbb;font-size:0.8rem">예) 암호 정책 &nbsp;|&nbsp; 개인정보 처리 절차 &nbsp;|&nbsp; 접속 기록 보관</span>
    </div>
  </div>

  <div class="hint">Enter 전송 · Shift+Enter 줄바꿈</div>

  <div class="chat-input-area">
    <textarea id="questionInput" rows="1" placeholder="규정 내용을 검색하세요..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">검색</button>
  </div>

</div>

<script>
  const input    = document.getElementById('questionInput');
  const sendBtn  = document.getElementById('sendBtn');
  const messages = document.getElementById('chatMessages');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function showLoading() {
    const el = document.createElement('div');
    el.className = 'loading-dots'; el.id = 'loadingDots';
    el.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }
  function hideLoading() {
    const el = document.getElementById('loadingDots');
    if (el) el.remove();
  }

  function toggleAccordion(el) {
    el.closest('.accordion').classList.toggle('open');
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    // 사용자 질문
    const userDiv = document.createElement('div');
    userDiv.className = 'msg-user';
    userDiv.textContent = question;
    messages.appendChild(userDiv);

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    showLoading();
    messages.scrollTop = messages.scrollHeight;

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      hideLoading();

      const block = document.createElement('div');
      block.className = 'result-block';

      if (data.error) {
        block.innerHTML = `<div class="no-result">⚠️ ${data.error}</div>`;

      } else if (!data.results || data.results.length === 0) {
        block.innerHTML = `<div class="no-result">관련 규정을 찾지 못했습니다.<br>다른 키워드로 다시 검색해 보세요.</div>`;

      } else {
        const header = document.createElement('div');
        header.className = 'result-header';
        header.textContent = `📋 관련 조항 ${data.results.length}건 — 타이틀을 클릭하면 내용을 확인할 수 있습니다`;
        block.appendChild(header);

        data.results.forEach(r => {
          const acc = document.createElement('div');
          acc.className = 'accordion';

          // 타이틀 행
          const titleRow = document.createElement('div');
          titleRow.className = 'accordion-title';
          titleRow.onclick = () => acc.classList.toggle('open');

          // 왼쪽: 장 + 조 묶음
          const titleGroup = document.createElement('div');
          titleGroup.className = 'title-group';

          if (r.chapter) {
            const chapterSpan = document.createElement('div');
            chapterSpan.className = 'chapter-text';
            chapterSpan.textContent = r.chapter;
            titleGroup.appendChild(chapterSpan);
          }

          const titleText = document.createElement('div');
          titleText.className = 'title-text';
          titleText.textContent = r.title;
          titleGroup.appendChild(titleText);

          const badge = document.createElement('span');
          badge.className = 'source-badge';
          badge.textContent = '📄 ' + r.source;

          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.textContent = '▼';

          titleRow.appendChild(titleGroup);
          titleRow.appendChild(badge);
          titleRow.appendChild(arrow);

          // 본문
          const body = document.createElement('div');
          body.className = 'accordion-body';
          body.textContent = r.content;

          acc.appendChild(titleRow);
          acc.appendChild(body);
          block.appendChild(acc);
        });
      }

      messages.appendChild(block);

    } catch (err) {
      hideLoading();
      const block = document.createElement('div');
      block.className = 'result-block';
      block.innerHTML = `<div class="no-result">⚠️ 서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>`;
      messages.appendChild(block);
    }

    messages.scrollTop = messages.scrollHeight;
    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
